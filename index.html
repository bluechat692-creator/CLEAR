<script>/* CLEAR: full-screen multi-step post composer. Plain JavaScript + Canvas. */

 }
 function close(fromPop=false){if(!state.open)return;if(state.items.length)draftSave();state.open=false;const el=$('clear-post-wizard');if(el)el.remove();if(!fromPop&&state.historyCount){state.historyCount=0;history.back()}else state.historyCount=0;}
 function bindRoot(root){root.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(a==='back')back();else if(a==='next')next();else if(a==='tab-post'){state.tab='post';render()}else if(a==='tab-story'){state.tab='story';state.items=state.items.slice(0,1);render()}else if(a==='pick')$('cp-files').click();else if(a==='camera')$('cp-camera').click();else if(a==='remove')removeItem(+b.dataset.i);else if(a==='select')selectItem(+b.dataset.i);else if(a==='ratio'){state.ratio=b.dataset.v;state.crop={scale:1,x:0,y:0};render();draftSave()}else if(a==='filter'){state.filter=b.dataset.v;mutateEdit(e=>e.filter=state.filter)}else if(a==='tool'){state.tool=b.dataset.v;render()}else if(a==='trash')mutateEdit(e=>{if(e.text.length)e.text.pop();else if(e.stickers.length)e.stickers.pop();else if(e.draw.length)e.draw.pop()});else if(a==='rotate')mutateEdit(x=>x.rotate=(x.rotate+90)%360);else if(a==='flip')mutateEdit(x=>x.flip=!x.flip);else if(a==='undo')undoEdit();else if(a==='redo')redoEdit();else if(a==='compare'){}else if(a==='share')share();else if(a==='addtext')addText();else if(a==='sticker')addSticker(b.dataset.v);else if(a==='drawtool'){state.drawTool=b.dataset.v;render()}else if(a==='drawundo'){const e=getEdit();if(e&&e.draw.length){e._drawRedo=e._drawRedo||[];e._drawRedo.push(e.draw.pop());render()}}else if(a==='drawredo'){const e=getEdit();if(e&&e._drawRedo?.length){e.draw.push(e._drawRedo.pop());render()}}else if(a==='reset')resetAdjustment(b.dataset.v);else if(a==='tagsearch')searchTags();else if(a==='tagremove')removeTag(b.dataset.id);else if(a==='audience'){state.audience=b.dataset.v;render();draftSave()}else if(a==='draft')draftSave().then(()=>toast('Draft saved on this device'));else if(a==='resume')resumeDraft();else if(a==='discard')draftDelete().then(()=>{state.items=[];render()});});
  root.addEventListener('input',e=>{const t=e.target;if(t.id==='cp-caption'){state.caption=t.value;const c=$('cp-count');if(c)c.textContent=t.value.length+'/2200';highlightCaption();clearTimeout(state.draftTimer);state.draftTimer=setTimeout(draftSave,350)}else if(t.id==='cp-location'){state.location=t.value;clearTimeout(state.draftTimer);state.draftTimer=setTimeout(draftSave,350)}else if(t.id==='cp-alt'){state.alt=t.value;clearTimeout(state.draftTimer);state.draftTimer=setTimeout(draftSave,350)}else if(t.id==='cp-tag-query'){clearTimeout(state.tagTimer);state.tagTimer=setTimeout(()=>searchTags(t.value),250)}else if(t.dataset.adjust){state.adjust[t.dataset.adjust]=+t.value;const ed=getEdit();if(ed){ed.adjust=ed.adjust||{};ed.adjust[t.dataset.adjust]=+t.value}drawPreview()}else if(t.id==='cp-strength'){state.strength=+t.value;const ed=getEdit();if(ed)ed.strength=state.strength;drawPreview()}else if(t.dataset.text!==undefined){const ed=getEdit();if(ed&&ed.text[+t.dataset.text]){ed.text[+t.dataset.text].text=t.value;drawPreview()}}else if(t.id==='cp-text-size'){const ed=getEdit();if(ed&&ed.text.length)ed.text[ed.text.length-1].size=+t.value;drawPreview()}else if(t.id==='cp-text-rotation'){const ed=getEdit();if(ed&&ed.text.length)ed.text[ed.text.length-1].rot=+t.value;drawPreview()}else if(t.id==='cp-sticker-size'){const ed=getEdit();if(ed&&ed.stickers.length)ed.stickers[ed.stickers.length-1].size=+t.value;drawPreview()}else if(t.id==='cp-sticker-rotation'){const ed=getEdit();if(ed&&ed.stickers.length)ed.stickers[ed.stickers.length-1].rot=+t.value;drawPreview()}else if(t.id==='cp-text-color'){const ed=getEdit();if(ed&&ed.text.length)ed.text[ed.text.length-1].color=t.value;drawPreview()}else if(t.id==='cp-text-bg'){const ed=getEdit();if(ed&&ed.text.length)ed.text[ed.text.length-1].bg=t.value;drawPreview()}});
  root.addEventListener('change',e=>{if(e.target.id==='cp-files'||e.target.id==='cp-camera')addFiles([...e.target.files]);if(e.target.id==='cp-caption')draftSave()});
  root.addEventListener('pointerdown',e=>{if(e.target.closest('.cp-compare')){state.compare=true;drawPreviewOriginal();return}if(e.target.matches('input[type=range]')&&e.target.closest('.cp-editor'))pushHistory();if(e.target.id==='cp-preview'||e.target.closest('#cp-preview'))beginCanvasGesture(e)});
  root.addEventListener('pointermove',moveCanvasGesture);root.addEventListener('pointerup',e=>{if(state.compare){state.compare=false;drawPreview()}endCanvasGesture(e)});root.addEventListener('pointercancel',e=>{if(state.compare){state.compare=false;drawPreview()}endCanvasGesture(e)});
 }
 function back(){if(state.step>0){if(state.historyCount){history.back();return}setStep(state.step-1);return}close()}
 function next(){if(state.step===0){if(!state.items.length)return toast('Choose at least one photo or video');if(state.items.some(x=>x.file.type.startsWith('video/'))&&state.items.length>1)return toast('A video post can contain one video at a time');setStep(state.items.some(x=>x.file.type.startsWith('video/'))?2:1)}else if(state.step===1){setStep(2)}else share()}

 function pickView(){const it=current();return `<div class="cp-pick"><div class="cp-preview-wrap">${it?mediaPreview(it):'<div class="cp-empty"><span>＋</span><b>Select photos or videos</b><small>Your selected media appears here</small></div>'}</div><div class="cp-tabs"><button class="${state.tab==='post'?'on':''}" data-act="tab-post">Post</button><button class="${state.tab==='story'?'on':''}" data-act="tab-story">Story</button></div><div class="cp-actions"><button data-act="pick">＋ Gallery</button><button data-act="camera">◎ Camera</button><input id="cp-files" type="file" accept="image/*,video/*" multiple hidden><input id="cp-camera" type="file" accept="image/*,video/*" capture="environment" hidden></div><div class="cp-grid">${state.items.map((x,i)=>`<button class="cp-thumb ${i===state.active?'active':''}" data-act="select" data-i="${i}">${x.file.type.startsWith('video/')?`<video src="${fileUrl(x)}" muted playsinline></video>`:`<img src="${fileUrl(x)}" alt="">`}<i>${i+1}</i><span data-act="remove" data-i="${i}">×</span></button>`).join('')}</div><p class="cp-hint">Select up to 10 photos for a carousel. Drag thumbnails to reorder.</p>${it&&it.file.type.startsWith('image/')?`<div class="cp-ratios">${[['original','Original'],['1:1','1:1'],['4:5','4:5'],['16:9','16:9']].map(([v,l])=>`<button class="${state.ratio===v?'on':''}" data-act="ratio" data-v="${v}">${l}</button>`).join('')}</div><p class="cp-hint">Pinch to zoom and drag the image to reposition it in the crop frame.</p>`:''}</div>`}

 function editorView(){const it=current();if(!it)return '<p class="cp-empty">Choose media first.</p>';if(it.file.type.startsWith('video/'))return `<div class="cp-editor"><video class="cp-media-preview" src="${fileUrl(it)}" controls playsinline></video><p class="cp-hint">Video is kept original in this version. Photo canvas editing tools apply to photos.</p></div>`;return `<div class="cp-editor"><div class="cp-editor-stage"><canvas id="cp-preview" class="cp-media-preview"></canvas><button class="cp-compare" data-act="compare">Hold to compare</button><button class="cp-trash" data-act="trash">🗑</button></div><div class="cp-editor-tabs"><button class="${state.tool==='Filters'?'on':''}" data-act="tool" data-v="Filters">Filters</button><button class="${state.tool==='Edit'?'on':''}" data-act="tool" data-v="Edit">Edit</button><button class="${state.tool==='Text'?'on':''}" data-act="tool" data-v="Text">Text</button><button class="${state.tool==='Draw'?'on':''}" data-act="tool" data-v="Draw">Draw</button><button class="${state.tool==='Stickers'?'on':''}" data-act="tool" data-v="Stickers">Stickers</button></div>${state.tool==='Filters'?filterPanel():state.tool==='Edit'?editPanel():state.tool==='Text'?textPanel():state.tool==='Draw'?drawPanel():stickerPanel()}<div class="cp-undo"><button data-act="undo">↶ Undo</button><button data-act="redo">↷ Redo</button><button data-act="rotate">Rotate 90°</button><button data-act="flip">Flip</button></div></div>`}

 function click(e){const b=e.target.closest('[data-vact],[data-vtab]');if(!b||!ed)return;if(b.dataset.vtab){ed.tab=b.dataset.vtab;panel();return}const a=b.dataset.vact;if(a==='close'){if(confirm('Discard this video edit and return to media selection?')){const input=ed.input;dispose();if(input)input.value=''}return}if(a==='original'){useOriginal();return}if(a==='done'){finish();return}if(a==='play'){play();return}if(a==='mute'){ed.muted=!ed.muted;ed.video.muted=ed.muted;b.textContent=ed.muted?'Muted':'Sound on';return}if(a==='set-start'){ed.start=Math.min(ed.playhead,ed.end-.1);syncTrim();return}if(a==='set-end'){ed.end=Math.max(ed.playhead,ed.start+.1);if(ed.end-ed.start>90)ed.end=ed.start+90;syncTrim();return}if(a==='cover-frame'){captureCover();return}if(a==='cover-upload'){$('cve-cover-file').click();return}if(a==='filter'){ed.filter=b.dataset.v;panel();return}if(a==='speed'){ed.speed=+b.dataset.v;ed.video.playbackRate=ed.speed;panel();return}if(a==='ratio'){ed.ratio=b.dataset.v;panel();return}if(a==='add-text'){const t=$('cve-text').value.trim();if(t){const c=$('cve-canvas');ed.overlays.push({text:t,start:ed.start,end:ed.end,x:(c?.width||720)/2,y:(c?.height||1280)*.78,size:42,rot:0,color:'#fff'});ed.activeOverlay=ed.overlays.length-1;panel()}return}if(a==='sticker'){const c=$('cve-canvas');ed.overlays.push({value:b.dataset.v,start:ed.start,end:ed.end,x:(c?.width||720)/2,y:(c?.height||1280)*.78,size:58,rot:0});ed.activeOverlay=ed.overlays.length-1;panel();return}if(a==='select-overlay'){ed.activeOverlay=+b.dataset.i;panel();return}if(a==='delete-overlay'){if(ed.activeOverlay>=0)ed.overlays.splice(ed.activeOverlay,1);ed.activeOverlay=-1;panel();return}if(a==='export'){exportVideo();return}if(a==='cancel-export'){cancelExport();return}}
 function input(e){if(!ed)return;const t=e.target;if(t.id==='cve-playhead'||t.id==='cve-scrub'){const tm=ed.duration*(+t.value/1000);ed.video.currentTime=tm;ed.playhead=tm;return}if(t.id==='cve-start'){ed.start=Math.min(+t.value,ed.end-.1);if(ed.end-ed.start>90)ed.end=ed.start+90;syncTrim();return}if(t.id==='cve-end'){ed.end=Math.max(+t.value,ed.start+.1);if(ed.end-ed.start>90)ed.end=ed.start+90;syncTrim();return}if(t.dataset.vslider){const k=t.dataset.vslider,val=+t.value;if(k==='strength')ed.strength=val;else if(k==='volume'){ed.volume=val/100;ed.video.volume=ed.muted?0:ed.volume}else if(k==='zoom')ed.zoom=val;else if(k==='ovsize'&&ed.activeOverlay>=0)ed.overlays[ed.activeOverlay].size=val;else if(k==='ovrot'&&ed.activeOverlay>=0)ed.overlays[ed.activeOverlay].rot=val;else ed.adjust[k]=val;const o=t.parentElement.querySelector('output');if(o)o.textContent=val+(k==='volume'||k==='strength'?'%':k==='zoom'?'×':'');}}
 function change(e){if(!ed)return;if(e.target.id==='cve-cover-file'&&e.target.files[0]){const f=e.target.files[0];if(ed.cover)URL.revokeObjectURL(ed.cover);ed.cover=URL.createObjectURL(f);ed.coverBlob=f;const l=$('cve-cover-state');if(l)l.textContent='Uploaded cover selected'}if(e.target.dataset.ov){const i=+e.target.dataset.i,o=ed.overlays[i];if(o){o[e.target.dataset.ov]=Math.max(0,Math.min(ed.duration,+e.target.value));if(o.end<o.start)o.end=o.start+.1}}}

 async function captureCover(){if(!ed)return;const c=document.createElement('canvas'),[w,h]=dims(1080);c.width=w;c.height=h;drawFrame(c.getContext('2d'),c);const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.9));if(!blob)return notify('Could not create cover image');if(ed.cover)URL.revokeObjectURL(ed.cover);ed.cover=URL.createObjectURL(blob);ed.coverBlob=blob;const l=$('cve-cover-state');if(l)l.textContent='Current frame selected'}
 let overlayPointer=null,pointers=new Map(),pinchBase=0,zoomBase=1;function overlayDown(e){if(!ed||!e.target.closest('#cve-canvas'))return;const c=$('cve-canvas');c.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ed.tab==='Crop'){overlayPointer={x:e.clientX,y:e.clientY,mode:'crop'};if(pointers.size===2){const a=[...pointers.values()];pinchBase=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoomBase=ed.zoom}return}if(ed.activeOverlay>=0)overlayPointer={x:e.clientX,y:e.clientY,mode:'overlay'};}function overlayMove(e){if(!ed||!overlayPointer)return;if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(overlayPointer.mode==='crop'){if(pointers.size>=2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinchBase)ed.zoom=Math.max(1,Math.min(3,zoomBase*d/pinchBase))}else{ed.panX+=e.clientX-overlayPointer.x;ed.panY+=e.clientY-overlayPointer.y;overlayPointer.x=e.clientX;overlayPointer.y=e.clientY}return}if(ed.activeOverlay<0)return;const o=ed.overlays[ed.activeOverlay],c=$('cve-canvas'),r=c.getBoundingClientRect();o.x+=(e.clientX-overlayPointer.x)*c.width/r.width;o.y+=(e.clientY-overlayPointer.y)*c.height/r.height;overlayPointer.x=e.clientX;overlayPointer.y=e.clientY}

 function progress(n,label){const p=$('cve-progress'),bar=$('cve-progressbar'),l=$('cve-progresslabel');if(p)p.hidden=false;if(bar)bar.style.width=n+'%';if(l)l.textContent=label}

  const mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4500000,audioBitsPerSecond:128000});ed.recorder=mr;mr.ondataavailable=e=>{if(e.data&&e.data.size)ed.chunks.push(e.data)};const finished=new Promise((ok,no)=>{mr.onstop=()=>ok();mr.onerror=e=>no(e.error||Error('Recorder error'))});const stopAt=ed.end;const startAt=ed.start;let startClock=performance.now();let expected=(stopAt-startAt)/ed.speed;let ended=false;const draw=()=>{if(!ed||ed.cancel||ended)return;drawFrame(ctx,canvas);const elapsed=(performance.now()-startClock)/1000;progress(Math.min(95,Math.round(elapsed/expected*95)),`Rendering ${Math.min(elapsed,expected).toFixed(1)} / ${expected.toFixed(1)} seconds…`);if(ed.video.currentTime>=stopAt-.035||elapsed>=expected+1){ended=true;try{mr.stop()}catch(e){}return}requestAnimationFrame(draw)};
  const stopBtn=document.querySelector('[data-vact="cancel-export"]');if(stopBtn)stopBtn.hidden=false;const exportBtn=document.querySelector('[data-vact="export"]');if(exportBtn)exportBtn.disabled=true;try{mr.start(250);await ed.video.play();ed.playing=true;requestAnimationFrame(draw);await finished;if(ed.cancel)throw Error('Export cancelled');const blob=new Blob(ed.chunks,{type:mime});if(!blob.size)throw Error('The browser returned an empty video');const ext=mime.includes('mp4')?'mp4':'webm';const out=new File([blob],`clear-video-${Date.now()}.${ext}`,{type:mime.split(';')[0]});const cover=ed.coverBlob||await frameBlob();const metadata={start:ed.start,end:ed.end,duration:(ed.end-ed.start)/ed.speed,speed:ed.speed,filter:ed.filter,adjust:{...ed.adjust},ratio:ed.ratio,coverBlob:cover,mime:mime};const input=ed.input;const original=ed.file;metaMap.set(out,metadata);dispose();if(input){const dt=new DataTransfer();dt.items.add(out);bypass=true;input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));bypass=false}notify(ext==='mp4'?'Video exported as MP4':'Video exported as WebM. Most current browsers play WebM; some iPhone/native players may not.');}catch(err){if(ed){try{if(mr&&mr.state!=='inactive')mr.stop()}catch(_){}ed.exporting=false;progress(0,err.message||'Export failed');notify(err.message||'Video export failed')} }finally{if(ed){ed.exporting=false;if(ed.stream)ed.stream.getTracks().forEach(t=>t.stop());ed.stream=null;const stopBtn2=document.querySelector('[data-vact="cancel-export"]');if(stopBtn2)stopBtn2.hidden=true;const eb=document.querySelector('[data-vact="export"]');if(eb)eb.disabled=false;}}

 async function frameBlob(){if(!ed)return null;const c=document.createElement('canvas'),[w,h]=dims(1080);c.width=w;c.height=h;drawFrame(c.getContext('2d'),c);return new Promise(ok=>c.toBlob(ok,'image/jpeg',.9))}
